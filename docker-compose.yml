version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: washlink
    ports: ["5432:5432"]
    volumes: [db_data:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: ./packages/api
    depends_on: [db, redis]
    env_file: .env
    ports: ["4000:4000"]
  web:
    build: ./apps/web
    env_file: .env
    ports: ["3000:3000"]
volumes:
  db_data:
